# PMSG platform, local stack.
#   docker compose up --build                 # db + api + web
#   docker compose --profile analytics up     # also the R Shiny dashboard (large image)
#
#   http://localhost:8080          marketing site      (/api/* and /analytics/* proxied)
#   http://localhost:8081          curriculum hub      (deployed build)
#   http://localhost:8082          curriculum site     (static source)
#   http://localhost:8000/docs     API (OpenAPI)

name: pmsg

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmsg}
      POSTGRES_USER: ${POSTGRES_USER:-pmsg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pmsg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pmsg}
      SEED_CSV: /data/cohort_25.csv
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
      - "8081:8081"
      - "8082:8082"
    depends_on:
      - api

  analytics:
    profiles: ["analytics"]
    build: ./analytics
    ports:
      - "3838:3838"

volumes:
  pgdata:
