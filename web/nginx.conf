# Marketing site (SPA) with API and analytics behind it
server {
    listen 80;
    root /usr/share/nginx/html/web;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only resolves when the "analytics" profile is running.
    location /analytics/ {
        resolver 127.0.0.11 valid=10s;
        set $shiny http://analytics:3838;
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass $shiny;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Curriculum hub: compiled build as deployed to edmhs-curriculum-pmsg.web.app
server {
    listen 8081;
    root /usr/share/nginx/html/curriculum-hub;
    location / { try_files $uri $uri/ /index.html; }
}

# Curriculum site: plain HTML/CSS/JS
server {
    listen 8082;
    root /usr/share/nginx/html/curriculum-site;
    error_page 404 /404.html;
}
