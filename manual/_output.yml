bookdown::gitbook:
  css: css/style.css
  config:
    toc:
      collapse: section
      scroll_highlight: yes
      before: |
        <li><a href="./">PMSG Platform Guide</a></li>
      after: |
        <li><a href="https://github.com/yourusername/pmsg-platform" target="blank">View Source Code</a></li>
    edit: null
    download: ["pdf", "epub", "mobi"]
    search: yes
    fontsettings:
      theme: white
      family: sans
      size: 2
    sharing:
      facebook: no
      twitter: no
      all: ['linkedin']
  pandoc_args: ["--number-sections"]

bookdown::pdf_book:
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
  pandoc_args: ["--number-sections"]
  toc_depth: 3
  toc_unnumbered: no
  toc_appendix: yes
  
bookdown::epub_book:
  stylesheet: css/style.css
  pandoc_args: ["--number-sections"]

bookdown::word_document2:
  #reference_docx: templates/pmsg_template.docx
  toc: yes
  toc_depth: 3
  number_sections: yes
  pandoc_args: ["--number-sections"]
